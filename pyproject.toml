[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stemma-workspace"
version = "0.1.0"
description = "Open, versioned FDA 510(k) predicate graph with provenance and recall linkage"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Steven Rocca" }
]
dependencies = [
    "requests>=2.28.0",
    "pandas>=2.0.0",
    "click>=8.0.0",
    "pillow>=10.0.0",
    "pydantic>=2.0.0",
    "duckdb>=0.9.0",
    "pdfplumber>=0.10.0",
    "tqdm>=4.65.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
