[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "stemma-core"
version = "0.1.0"
description = "Core data contracts, schemas, and storage utilities for Stemma"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Steven Rocca" }
]
dependencies = [
    "pydantic>=2.0.0",
    "duckdb>=0.9.0",
    "pandas>=2.0.0",
    "pyarrow>=12.0.0",
]

[project.scripts]
stemma-data = "stemma.core.data_loader:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["stemma*"]
