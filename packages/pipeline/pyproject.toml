[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "recension-pipeline"
version = "0.1.0"
description = "Data engineering pipeline for scraping, OCR, extraction, and linkage of FDA 510(k) lineages"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "AGPL-3.0-only"}
authors = [
    { name = "Steven Rocca" }
]
dependencies = [
    "click>=8.0.0",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
# PDF text extraction (ADR-014); without it the parser falls back to pdftotext and warns.
pdf = ["pdfplumber>=0.10.0"]

[project.scripts]
recension-pipeline = "recension.pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["recension*"]
