[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "recension-models"
version = "0.1.0"
description = "Survival analysis, features, and backtesting for the Recension recall-risk score"
requires-python = ">=3.10"
license = {text = "AGPL-3.0-only"}
authors = [
    { name = "Steven Rocca" }
]
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
include = ["recension*"]
