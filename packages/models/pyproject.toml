[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "stemma-models"
version = "0.1.0"
description = "Survival analysis, features, and backtesting for the Stemma recall-risk score"
requires-python = ">=3.10"
authors = [
    { name = "Alden Reagins" }
]
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
include = ["stemma*"]
